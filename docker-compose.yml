services:
  postgres:
    image: postgres:16-alpine
    container_name: arcticblu-postgres
    environment:
      POSTGRES_DB: subscription_capacity
      POSTGRES_USER: arcticblu
      POSTGRES_PASSWORD: arcticblu
    ports:
      # Bind to loopback only for security reasons, as the database should not be exposed to the outside world.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcticblu -d subscription_capacity"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: