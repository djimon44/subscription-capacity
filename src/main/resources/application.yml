spring:
  application:
    name: subscription-capacity

  datasource:
    url: jdbc:postgresql://localhost:5432/subscription_capacity
    username: ${DB_USERNAME:arcticblu}
    password: ${DB_PASSWORD:arcticblu}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

arcticblu:
  optimization:
    # A request is rejected when capacity > maxTableCells / (itemCount + 1) - 1, with
    # capacity expressed in minor units. Three tables are allocated (two long, one
    # boolean) at 17 bytes per cell, so this ceiling corresponds to roughly 850 MB.
    # Requests exceeding it fail with ProblemTooLargeException, pending the
    # branch-and-bound solver, which is not bounded by capacity.
    max-table-cells: 50000000