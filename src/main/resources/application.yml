spring:
  application:
    name: subscription-capacity

  datasource:
    url: jdbc:postgresql://localhost:5432/subscription_capacity
    username: ${DB_USERNAME:arcticblu}
    password: ${DB_PASSWORD:arcticblu}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

arcticblu:
  optimization:
    # Dynamic programming is used while capacity <= maxTableCells / (itemCount + 1) - 1,
    # with capacity expressed in minor units.
    #
    # Memory arithmetic: a single request allocates three tables of maxTableCells cells,
    # two long[][] at 8 bytes per cell and one boolean[][] at 1 byte, so 17 bytes per
    # cell in total. At 10,000,000 cells that is roughly 170 MB for one request. The
    # previous 50,000,000 allowed roughly 865 MB, which one request could claim on its
    # own; an OutOfMemoryError is an Error rather than an Exception, so it would escape
    # the RFC 9457 catch-all entirely.
    #
    # Exceeding the ceiling is not a rejection. Those problems fall through to branch and
    # bound, whose cost depends on the candidate count rather than the capacity value, so
    # a large capacity is still answered exactly.
    #
    # The value is a deliberate trade, not a safety margin: raising it lets dynamic
    # programming cover more requests and so takes the exponential branch-and-bound path
    # less often, at the price of a larger worst-case allocation for a single request.
    max-table-cells: 10000000

    # The pool of declined candidates grows without bound over the life of the service, and
    # every carried candidate enlarges the problem the solver must handle - candidate count
    # drives both the branch and bound search and the dynamic programming table's row count.
    # This keeps a single request's cost predictable regardless of how much history has
    # accumulated. Ordering (see SubscriptionRequestRepository) means a truncated pool still
    # keeps the freshest declined candidates rather than an arbitrary subset.
    max-carried-forward-candidates: 100